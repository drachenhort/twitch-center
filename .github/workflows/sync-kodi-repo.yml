name: Sync vendored copy into jellyfin-kodi-plex

on:
  push:
    branches: [master]
    paths:
      - "addon.xml"
      - "addon.py"
      - "icon.png"
      - "lib/**"
      - "resources/**"
      - "tests/**"
      - "CHANGELOG.md"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout twitch-center
        uses: actions/checkout@v4
        with:
          path: twitch-center

      - name: Checkout jellyfin-kodi-plex
        uses: actions/checkout@v4
        with:
          repository: drachenhort/jellyfin-kodi-plex
          token: ${{ secrets.SYNC_REPO_TOKEN }}
          path: jellyfin-kodi-plex

      - name: Sync script.twitch.center vendor tree
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='screenshots' \
            --exclude='design' \
            --exclude='docs/superpowers' \
            --exclude='.github' \
            --exclude='tools' \
            --exclude='tests/test_build_zip.py' \
            twitch-center/ jellyfin-kodi-plex/script.twitch.center/

      - name: Commit and push if changed
        working-directory: jellyfin-kodi-plex
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('script.twitch.center/addon.xml').getroot().attrib['version'])")
          git add -A script.twitch.center
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "sync script.twitch.center vendor copy to v${version}"
            git push
          fi
